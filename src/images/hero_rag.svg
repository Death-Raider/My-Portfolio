<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1029"/>
      <stop offset="1" stop-color="#3b1d4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1200" cy="200" r="450" fill="url(#glow)"/>
  <circle cx="300" cy="750" r="380" fill="url(#glow)"/>
  <!-- document -->
  <g transform="translate(180,260)">
    <rect x="0" y="0" width="220" height="290" rx="12" fill="none" stroke="#c084fc" stroke-opacity="0.6" stroke-width="3"/>
    <g stroke="#e9d5ff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round">
      <line x1="30" y1="50" x2="190" y2="50"/>
      <line x1="30" y1="95" x2="190" y2="95"/>
      <line x1="30" y1="140" x2="150" y2="140"/>
      <line x1="30" y1="185" x2="190" y2="185"/>
      <line x1="30" y1="230" x2="120" y2="230"/>
    </g>
  </g>
  <!-- chunks flowing into vector space -->
  <g fill="none" stroke="#c084fc" stroke-opacity="0.45" stroke-width="2.5">
    <path d="M 400 330 C 560 330 600 300 720 300"/>
    <path d="M 400 405 C 560 405 600 405 720 405"/>
    <path d="M 400 480 C 560 480 600 510 720 510"/>
  </g>
  <!-- embedding grid -->
  <g fill="#e879f9">
    <circle cx="780" cy="260" r="7" fill-opacity="0.9"/><circle cx="850" cy="300" r="5" fill-opacity="0.5"/>
    <circle cx="790" cy="360" r="6" fill-opacity="0.7"/><circle cx="880" cy="400" r="8" fill-opacity="0.9"/>
    <circle cx="800" cy="460" r="5" fill-opacity="0.5"/><circle cx="860" cy="520" r="7" fill-opacity="0.8"/>
    <circle cx="920" cy="340" r="5" fill-opacity="0.4"/><circle cx="940" cy="480" r="6" fill-opacity="0.6"/>
  </g>
  <!-- retrieval to answer bubble -->
  <path d="M 960 400 C 1100 400 1140 380 1250 380" fill="none" stroke="#e879f9" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="12 10"/>
  <g transform="translate(1250,320)">
    <rect x="0" y="0" width="180" height="110" rx="18" fill="none" stroke="#e9d5ff" stroke-opacity="0.65" stroke-width="3"/>
    <path d="M 40 110 L 40 145 L 80 110" fill="none" stroke="#e9d5ff" stroke-opacity="0.65" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#e9d5ff" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round">
      <line x1="30" y1="40" x2="150" y2="40"/>
      <line x1="30" y1="72" x2="110" y2="72"/>
    </g>
  </g>
  <g fill="#ffffff" fill-opacity="0.06">
    <circle cx="150" cy="120" r="4"/><circle cx="600" cy="90" r="3"/><circle cx="1100" cy="750" r="4"/>
    <circle cx="1450" cy="620" r="3"/><circle cx="700" cy="800" r="4"/><circle cx="1520" cy="130" r="3"/>
  </g>
</svg>
